name: template-sync

# Keeps cloned Contextual Site repos in sync with the upstream astro-core-worker template.
on:
  schedule:
    - cron: "0 14 * * *" # Daily @ 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: template-sync

jobs:
  template-sync:
    runs-on: ubuntu-latest
    # This action should only run on template clones
    if: ${{ !github.event.repository.is_template }}
    steps:
      - name: Sync from astro-core-worker template
        uses: ContextualIO/template-sync-action@v1
        env:
          CONTEXTUAL_SILO: ${{ vars.CONTEXTUAL_SILO }}
          CONTEXTUAL_CONNECTIONS_URL: ${{ vars.CONTEXTUAL_CONNECTIONS_URL }}
        with:
          template-repository: ContextualIO/astro-core-worker
          template-branch: ${{ vars.CONTEXTUAL_TEMPLATE_BRANCH || 'stable' }}
          organization: ${{ vars.CONTEXTUAL_ORGANIZATION }}
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN || github.token }}
