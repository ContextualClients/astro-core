name: template-sync

# Keeps cloned Contextual Site repos in sync with the upstream astro-core template.
on:
  schedule:
    - cron: "0 14 * * *" # Daily @ 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  template-sync:
    runs-on: ubuntu-latest
    # This action should only run on template clones
    if: ${{ !github.event.repository.is_template }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync from astro-core template
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          TEMPLATE_REMOTE: https://github.com/${{ github.repository_owner }}/astro-core.git
        run: ./bin/template-sync.sh
